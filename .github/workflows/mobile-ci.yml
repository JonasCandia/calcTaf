name: Mobile CI

# Builda/testa os projetos em mobile/ (módulo shared KMP, app Android, framework iOS).
# Usa gradle/actions/setup-gradle, que provisiona o Gradle diretamente — não depende
# do gradle-wrapper.jar (binário, não versionado neste repo; ver mobile/SETUP.md).

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  shared:
    name: Shared (testes de lógica)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Rodar testes do módulo shared (JVM)
        run: gradle -p mobile :shared:jvmTest

  android:
    name: Android (build debug)
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK debug
        run: gradle -p mobile :androidApp:assembleDebug

  ios-framework:
    name: iOS (build do XCFramework shared)
    runs-on: macos-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build do XCFramework do shared
        run: gradle -p mobile :shared:assembleSharedDebugXCFramework
      # TODO (após a Fase 5): quando o projeto Xcode real existir em mobile/iosApp,
      # adicionar aqui um passo `xcodebuild` para compilar o app completo.
