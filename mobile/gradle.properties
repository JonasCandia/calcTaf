org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.mpp.stability.nowarn=true

# AGP 9 passou a ter "Kotlin embutido" por padrão, incompatível com o combo
# com.android.library + kotlin("multiplatform") usado em mobile/shared.
# Desligado deliberadamente até migrarmos para o plugin dedicado
# com.android.kotlin.multiplatform.library (ver https://kotl.in/gradle/agp-built-in-kotlin).
android.builtInKotlin=false
android.newDsl=false

# Os alvos iOS do :shared (iosX64/iosSimulatorArm64) não rodam neste host
# Windows — só compilam de fato em macOS/CI (ver .github/workflows/mobile-ci.yml).
kotlin.native.ignoreDisabledTargets=true
